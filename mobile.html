<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F5F7">
<title>优宅邦 NestWise · 移动版</title>
<script>
  /* 管理员权限在 CSS 层同步生效（与 index.html 一致） */
  try { var _hh = JSON.parse(localStorage.getItem('house_hunter_session') || 'null'); if (_hh && _hh.isAdmin) document.documentElement.classList.add('is-admin'); } catch(e) {}
  /* 移动端独立入口标记：app.js 据此调整默认视图等桌面专属逻辑 */
  window._MOBILE_APP = true;
</script>
<link rel="stylesheet" href="css/style.css?v=20261016">
</head>
<body class="mobile-app">

<!-- 刷新加载过渡：与桌面版一致的加载动画 -->
<div id="appLoader" class="app-loader" aria-hidden="false">
  <style>
    .app-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      transition:opacity .3s ease,visibility .3s}
    .app-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
    .app-loader-spin{width:34px;height:34px;border:3px solid rgba(0,113,227,.18);border-top-color:var(--primary,#0071E3);
      border-radius:50%;animation:loaderSpin .7s linear infinite}
    @keyframes loaderSpin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.app-loader-spin{animation:none}}
  </style>
  <div class="app-loader-spin" role="status" aria-label="加载中"></div>
</div>

<!-- 移动端顶栏：品牌 + AI 助手 + 城市 + 用户（毛玻璃固定） -->
<header class="m-topbar">
  <div class="m-topbar-inner">
    <a class="m-topbar-brand" href="#dashboard" onclick="App.navigate('dashboard');return false;" aria-label="优宅邦首页">
      <svg width="22" height="22" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="var(--primary)" stroke-width="2.8" d="M3 10.5 L16 2 L29 10.5"/>
        <path stroke="var(--primary)" stroke-width="3.2" d="M8 12 L8 28"/>
        <path stroke="var(--primary)" stroke-width="3.2" d="M8 12 L20 28"/>
        <path stroke="var(--primary)" stroke-width="3.2" d="M20 12 L20 28"/>
      </svg>
      <strong class="m-topbar-name">优宅邦</strong>
    </a>
    <button type="button" class="topbar-ai" onclick="App.goChat()" title="AI 购房助手">
      <span class="topbar-ai-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg></span>
      <span class="topbar-ai-txt">AI 助手</span>
    </button>
    <div class="topbar-city" id="topbarCity"></div>
    <div class="topbar-user" id="topbarUser"></div>
  </div>
</header>

<!-- 主内容区：视图由 app.js 动态渲染 -->
<main class="main-content" id="mainContent"></main>

<!-- 移动端底部导航：首页 / 房源 / 日程 / 更多 / 我的 -->
<nav class="mobile-tabbar" id="mobileTabbar">
  <a href="#dashboard" class="tab active" data-view="dashboard">
    <span class="tab-ico"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5Z"/></svg></span>
    <em>首页</em>
  </a>
  <a href="#records" class="tab" data-view="records">
    <span class="tab-ico"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
    <em>房源</em>
  </a>
  <a href="#calendar" class="tab" data-view="calendar">
    <span class="tab-ico"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
    <em>日程</em>
  </a>
  <a href="#more" class="tab" data-view="more">
    <span class="tab-ico"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>
    <em>更多</em>
  </a>
  <a href="#profile" class="tab" data-view="profile">
    <span class="tab-ico"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.6 3.6-6 8-6s8 2.4 8 6"/></svg></span>
    <em>我的</em>
  </a>
</nav>

<!-- 移动端「更多」底部抽屉：网格列出全部功能入口 -->
<div class="more-mask" id="moreMask" style="display:none" aria-hidden="true">
  <div class="more-sheet" id="moreSheet" role="dialog" aria-label="全部功能">
    <div class="more-sheet-handle" aria-hidden="true"></div>
    <div class="more-sheet-head">
      <h3>全部功能</h3>
      <button type="button" class="more-sheet-close" onclick="App.closeMore()" aria-label="关闭">✕</button>
    </div>
    <div class="more-sheet-grid" id="moreGrid"></div>
  </div>
</div>

<!-- 通用模态框（移动端自动转为底部抽屉样式） -->
<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="Utils.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<!-- 返回顶部 -->
<button type="button" id="toTopBtn" class="to-top-btn" aria-label="返回顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
</button>

<!-- Scripts：与桌面版一致的模块集合（defer 并行下载） -->
<script src="js/modules/auth.js?v=20260928" defer></script>
<script src="js/modules/sync.js?v=20260934" defer></script>
<script src="js/store.js?v=20260928" defer></script>
<script src="js/utils.js?v=20260934" defer></script>
<script src="js/modules/voice.js?v=20260942" defer></script>
<script src="js/modules/dashboard.js?v=20260928" defer></script>
<script src="js/modules/records.js?v=20260928" defer></script>
<script src="js/modules/expectation.js?v=20261016" defer></script>
<script src="js/modules/calendar.js?v=20260928" defer></script>
<script src="js/modules/chat.js?v=20261016" defer></script>
<script src="js/modules/news.js?v=20261003" defer></script>
<script src="js/modules/settings.js?v=20261016" defer></script>
<script src="js/app.js?v=20261012" defer></script>
</body>
</html>
