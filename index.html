<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F5F7">
<link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
<title>优宅邦 NestWise · 专业购房决策门户</title>
<meta name="description" content="优宅邦 NestWise · 个人房产智慧决策工具，AI助力精准安家">
<script>
  /* 管理员权限在 CSS 层同步生效：刷新页面时"系统管理"菜单不出现短暂消失 */
  try { var _hh = JSON.parse(localStorage.getItem('house_hunter_session') || 'null'); if (_hh && _hh.isAdmin) document.documentElement.classList.add('is-admin'); } catch(e) {}
</script>
<link rel="stylesheet" href="css/style.css?v=20260924">
</head>
<body>

<!-- 刷新加载过渡：保持页面背景，仅居中一个旋转加载图标 -->
<div id="appLoader" class="app-loader" aria-hidden="false">
  <style>
    .app-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      transition:opacity .3s ease,visibility .3s}
    .app-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
    .app-loader-spin{width:34px;height:34px;border:3px solid rgba(0,113,227,.18);border-top-color:var(--primary,#0071E3);
      border-radius:50%;animation:loaderSpin .7s linear infinite}
    @keyframes loaderSpin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.app-loader-spin{animation:none}}
  </style>
  <div class="app-loader-spin" role="status" aria-label="加载中"></div>
</div>

<!-- 门户式顶部导航 · 深蓝奢华风 -->
<header class="topbar">
  <div class="topbar-inner">
    <!-- 品牌区 · 优宅邦 NestWise · 白色主体+金色点缀，蓝底高对比清晰可见 -->
    <div class="topbar-brand">
      <div class="brand-logo" aria-label="优宅邦 Logo">
        <!-- 白底蓝方：纯白SVG线条 + 金色对勾点缀 · 在蓝色背景方块上对比分明 -->
        <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- 屋顶 · 白色描边 -->
          <path stroke="#FFFFFF" stroke-width="2.8" d="M3 10.5 L16 2 L29 10.5"/>
          <!-- N字母 · 白色描边（粗一点更清楚） -->
          <path stroke="#FFFFFF" stroke-width="3.2" d="M8 12 L8 28"/>
          <path stroke="#FFFFFF" stroke-width="3.2" d="M8 12 L20 28"/>
          <path stroke="#FFFFFF" stroke-width="3.2" d="M20 12 L20 28"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>优宅邦 <span style="font-weight:600;color:var(--primary);letter-spacing:-0.01em;">NestWise</span></h1>
        <p>智慧选房 · 决策无忧</p>
      </div>
    </div>

    <!-- 紧凑导航 · 含看房助手/系统管理子菜单下拉 -->
    <nav class="topbar-nav" id="navList">
      <a class="nav-item active" data-view="chat"><em>AI 购房</em></a>
      <a class="nav-item" data-view="dashboard"><em>看房画像</em></a>
      <a class="nav-item" data-view="expectation"><em>期望档案</em></a>
      <a class="nav-item" data-view="calendar"><em>看房日程</em></a>
      <a class="nav-item" data-view="records"><em>房源记录</em></a>
      <a class="nav-item" data-view="news"><em>房产资讯</em></a>
      <a class="nav-item" data-view="compare"><em>决策对比</em></a>
      <a class="nav-item" data-view="report"><em>看房报告</em></a>
      <a class="nav-item" data-view="workflow"><em>购房进度</em></a>
      <a class="nav-item nav-trigger" data-dd="assistantDD" aria-haspopup="true">
        <em>看房助手</em>
        <svg class="dd-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </a>
      <a class="nav-item nav-trigger admin-only" data-dd="adminDD" aria-haspopup="true">
        <em>系统管理</em>
        <svg class="dd-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </a>
    </nav>
    <!-- 顶栏城市切换 · 全局可见，切换后区域选项联动 -->
    <div class="topbar-city" id="topbarCity"></div>
    <!-- 顶栏用户菜单 · 登录账号 + 退出 -->
    <div class="topbar-user" id="topbarUser"></div>
    <!-- 看房助手子菜单 · 独立于横向滚动容器，避免被 overflow 裁剪 -->
    <div class="nav-submenu" id="assistantDD" role="menu">
      <a class="nav-sub-item" data-view="finance" role="menuitem"><em>财务计算</em></a>
      <a class="nav-sub-item" data-view="location" role="menuitem"><em>区位分析</em></a>
    </div>
    <!-- 系统管理子菜单 · 仅管理员可见 -->
    <div class="nav-submenu admin-only" id="adminDD" role="menu">
      <a class="nav-sub-item" data-view="admin-users" role="menuitem"><em>用户管理</em></a>
      <a class="nav-sub-item" data-view="admin-logs" role="menuitem"><em>访问日志</em></a>
      <a class="nav-sub-item" data-view="admin-config" role="menuitem"><em>配置清单</em></a>
      <a class="nav-sub-item" data-view="admin-data" role="menuitem"><em>数据处理</em></a>
      <a class="nav-sub-item" data-view="admin-quota" role="menuitem"><em>额度管理</em></a>
    </div>

    <!-- 快捷按钮区：用户确认删除"新增房源"重复入口（房源记录模块自有新建） -->
  </div>
</header>

<!-- 移动端底部导航 -->
<nav class="mobile-tabbar" id="mobileTabbar">
  <a href="#dashboard" class="tab active" data-view="dashboard">
    <span class="tab-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5Z"/></svg></span>
    <em>首页</em>
  </a>
  <a href="#records" class="tab" data-view="records">
    <span class="tab-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
    <em>房源</em>
  </a>
  <a href="#calendar" class="tab" data-view="calendar">
    <span class="tab-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
    <em>日程</em>
  </a>
  <a href="#tools" class="tab" data-view="tools">
    <span class="tab-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18v3h3l5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7Z"/></svg></span>
    <em>工具</em>
  </a>
  <a href="#more" class="tab" data-view="more">
    <span class="tab-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span>
    <em>更多</em>
  </a>
</nav>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
  <!-- 视图由JS动态渲染 -->
</main>

<!-- 全局页脚 · 底部居中 -->
<footer class="site-footer">
  <div class="footer-inner">
    <svg class="footer-logo" width="15" height="15" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 L16 2 L29 10.5"/><path d="M8 12 L8 28"/><path d="M8 12 L20 28"/><path d="M20 12 L20 28"/></svg>
    <strong>优宅邦 NestWise</strong>
  </div>
</footer>

<!-- 返回顶部 -->
<button type="button" id="toTopBtn" class="to-top-btn" aria-label="返回顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
</button>

<!-- 通用模态框 -->
<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="Utils.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<!-- Scripts（defer 并行下载不阻塞解析；echarts 与低频模块按需加载，首屏减负） -->
<script src="js/modules/auth.js?v=20260928" defer></script>
<script src="js/modules/sync.js?v=20260928" defer></script>
<script src="js/store.js?v=20260928" defer></script>
<script src="js/utils.js?v=20260928" defer></script>
<script src="js/modules/dashboard.js?v=20260928" defer></script>
<script src="js/modules/records.js?v=20260928" defer></script>
<script src="js/modules/expectation.js?v=20260928" defer></script>
<script src="js/modules/calendar.js?v=20260928" defer></script>
<script src="js/modules/chat.js?v=20260928" defer></script>
<script src="js/modules/news.js?v=20260928" defer></script>
<script src="js/modules/settings.js?v=20260928" defer></script>
<script src="js/app.js?v=20260929" defer></script>
</body>
</html>
