<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E3A8A">
<title>HOUSE HUNTER · 南京看房决策门户</title>
<meta name="description" content="Premium Real Estate Decision Portal · 个人购房决策工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Serif:wght@400;700&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260820e">
</head>
<body>

<!-- 门户式顶部导航 · 深蓝奢华风 -->
<header class="topbar">
  <div class="topbar-inner">
    <!-- 品牌区 · 奢华门户风格 -->
    <div class="topbar-brand">
      <div class="brand-logo">
        <!-- SVG 房屋图标 · 不使用 emoji 作为结构 icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#1E293B">
          <path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5Z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>HOUSE HUNTER</h1>
        <p>Premium Property Decision Portal</p>
      </div>
    </div>

    <!-- 门户式导航 · 单排 12 项 · 纯文字（无图标），字号更大便于识别 -->
    <nav class="topbar-nav" id="navList">
      <a class="nav-item active" data-view="dashboard"><em>仪表盘</em></a>
      <a class="nav-item" data-view="records"><em>房源记录</em></a>
      <a class="nav-item" data-view="expectation"><em>期望档案</em></a>
      <a class="nav-item" data-view="calendar"><em>看房日程</em></a>
      <a class="nav-item" data-view="recommend"><em>房源推荐</em></a>
      <a class="nav-item" data-view="compare"><em>决策对比</em></a>
      <a class="nav-item" data-view="finance"><em>财务计算</em></a>
      <a class="nav-item" data-view="location"><em>区位分析</em></a>
      <a class="nav-item" data-view="aids"><em>实地检查清单</em></a>
      <a class="nav-item" data-view="workflow"><em>购房进度追踪</em></a>
      <a class="nav-item" data-view="settings"><em>系统设置</em></a>
    </nav>

    <!-- 快捷按钮区：用户确认删除"新增房源"重复入口（房源记录模块自有新建） -->
  </div>
</header>

<!-- 移动端底部导航 -->
<nav class="mobile-tabbar" id="mobileTabbar">
  <a href="#dashboard" class="tab active" data-view="dashboard"><span>🏠</span><em>首页</em></a>
  <a href="#records" class="tab" data-view="records"><span>📋</span><em>房源</em></a>
  <a href="#calendar" class="tab" data-view="calendar"><span>📅</span><em>日程</em></a>
  <a href="#tools" class="tab" data-view="tools"><span>🧰</span><em>工具</em></a>
  <a href="#more" class="tab" data-view="more"><span>☰</span><em>更多</em></a>
</nav>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
  <!-- 视图由JS动态渲染 -->
</main>

<!-- 通用模态框 -->
<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="Utils.closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="js/store.js?v=20260819h"></script>
<script src="js/utils.js?v=20260820b"></script>
<script src="js/modules/dashboard.js?v=20260820d"></script>
<script src="js/modules/records.js?v=20260820c"></script>
<script src="js/modules/expectation.js?v=20260819j"></script>
<script src="js/modules/calendar.js?v=20260820a"></script>
<script src="js/modules/recommend.js?v=20260820b"></script>
<script src="js/modules/compare.js?v=20260820d"></script>
<script src="js/modules/finance.js?v=20260819j"></script>
<script src="js/modules/location.js?v=20260820f"></script>
<script src="js/modules/aids.js?v=20260819j"></script>
<script src="js/modules/workflow.js?v=20260819j"></script>
<script src="js/modules/settings.js?v=20260820a"></script>
<script src="js/app.js?v=20260820c"></script>
</body>
</html>
